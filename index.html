<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anoba — Google Play Store'a Yönlendiriliyorsunuz...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: #232066;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 360px;
      width: 100%;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #D4AF37;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a.btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #232066;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
  <script>
    window.onload = function() {
      // 🚀 Instagram In-App Browser engelini aşan Android Intent Protokolü
      var marketIntent = "intent://details?id=com.neval.anoba#Intent;scheme=market;package=com.android.vending;end";
      var webFallback = "https://play.google.com/store/apps/details?id=com.neval.anoba";

      // Doğrudan cihazdaki Google Play uygulamasını tetikle
      window.location.href = marketIntent;

      // Eğer 1.2 saniye içinde uygulama açılamazsa standart web mağazasına yönlendir
      setTimeout(function() {
        window.location.href = webFallback;
      }, 1200);
    };
  </script>
</head>
<body>
  <div class="card">
    <h2>Anoba</h2>
    <div class="spinner"></div>
    <p>Google Play Store açılıyor...</p>
    <p style="font-size: 12px; color: #666;">Açılmazsa aşağıdaki butona tıklayın:</p>
    <a href="https://play.google.com/store/apps/details?id=com.neval.anoba" class="btn">Google Play'de Aç 🚀</a>
  </div>
</body>
</html>
